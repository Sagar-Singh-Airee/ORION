<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORION Review</title>
  <style>
    :root { color-scheme: dark; --bg:#0c111b; --panel:#131c2b; --line:#27354c; --text:#e6edf7; --muted:#9fb0c8; --accent:#59b2ff; --alert:#f3b65d; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { width:min(920px,calc(100% - 32px)); margin:48px auto; } header { display:flex; justify-content:space-between; align-items:baseline; gap:16px; border-bottom:1px solid var(--line); padding-bottom:20px; }
    h1 { margin:0; font-size:28px; letter-spacing:.08em; } h1 span { color:var(--accent); } .status { color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:28px; } .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px; }
    .panel h2 { margin:0 0 16px; font-size:16px; } label { display:block; color:var(--muted); font-size:13px; margin:14px 0 6px; } input, textarea { width:100%; border:1px solid var(--line); border-radius:7px; background:#0f1725; color:var(--text); padding:10px; font:inherit; } textarea { min-height:150px; resize:vertical; }
    button { width:100%; margin-top:18px; border:0; border-radius:7px; background:var(--accent); color:#07111e; font-weight:700; padding:11px; cursor:pointer; } button:disabled { opacity:.55; cursor:wait; } .empty { color:var(--muted); padding:14px 0; } .error { color:var(--alert); }
    .result { display:grid; gap:12px; } .finding { display:grid; grid-template-columns:minmax(130px,1fr) 42px; gap:10px; align-items:center; } .finding label { margin:0; color:var(--text); } .bar { grid-column:1 / -1; height:7px; background:#0c1420; border-radius:99px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--accent); border-radius:inherit; }
    footer { color:var(--muted); font-size:12px; margin-top:18px; } @media (max-width:700px) { main { margin:24px auto; } .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <header><h1><span>O</span>RION Review</h1><div id="health" class="status">Checking service…</div></header>
    <div class="grid">
      <section class="panel"><h2>Study input</h2><form id="predict-form"><label for="study-path">Mounted study directory</label><input id="study-path" required placeholder="/data/study_001"><label for="report">Radiology report (optional)</label><textarea id="report" placeholder="Paste the report only when using a multimodal model."></textarea><button id="submit" type="submit">Run review</button></form></section>
      <section class="panel"><h2>Predicted findings</h2><div id="results" class="empty">Select a DICOM study to view probabilities.</div></section>
    </div>
    <footer>Predictions support review and experimentation; they are not a clinical diagnosis.</footer>
  </main>
  <script>
    const health = document.getElementById('health'), results = document.getElementById('results'), form = document.getElementById('predict-form'), submit = document.getElementById('submit');
    async function checkHealth() { try { const response = await fetch('/health'); const data = await response.json(); health.textContent = data.model_loaded ? `Model ready · ${data.model_version || 'unknown version'}` : 'Model not loaded'; } catch { health.textContent = 'Service unavailable'; } }
    function display(probabilities) { results.className = 'result'; results.replaceChildren(...Object.entries(probabilities).sort((a,b)=>b[1]-a[1]).map(([name, value]) => { const row=document.createElement('div'); row.className='finding'; const label=document.createElement('label'); label.textContent=name.replaceAll('_',' '); const score=document.createElement('strong'); score.textContent=`${(value*100).toFixed(1)}%`; const bar=document.createElement('div'); bar.className='bar'; const fill=document.createElement('i'); fill.style.width=`${Math.max(0,Math.min(100,value*100))}%`; bar.append(fill); row.append(label,score,bar); return row; })); }
    form.addEventListener('submit', async event => { event.preventDefault(); submit.disabled=true; submit.textContent='Running…'; results.className='empty'; results.textContent='Loading and preprocessing the study…'; try { const response=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({study_path:document.getElementById('study-path').value,report_text:document.getElementById('report').value||null})}); const data=await response.json(); if(!response.ok) throw new Error(data.detail||'Prediction failed'); display(data.probabilities); } catch(error) { results.className='error'; results.textContent=error.message; } finally { submit.disabled=false; submit.textContent='Run review'; } });
    checkHealth();
  </script>
</body>
</html>
