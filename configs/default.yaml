# Base config — every experiment/*.yaml merges over this.
# Defaults assume a single Kaggle/Colab GPU (T4 16GB / P100 16GB / A100 40GB single-instance):
# no DDP, AMP on, small-to-moderate batch size with gradient accumulation to reach an
# effective batch size, aggressive disk caching so re-running a session doesn't re-decode DICOM.

project:
  name: orion-rsna-knee-2026
  seed: 42
  deterministic: false          # true only for the final submission-locking run
  output_dir: /kaggle/working/orion_runs   # override per-platform via CLI dotlist

paths:
  data_dir: ${data.root}
  output_dir: ${project.output_dir}

labels:
  names: [acl, mcl, medial_meniscus, lateral_meniscus, medial_oa, lateral_oa, pf_oa, effusion, synovitis, bakers_cyst, contusion, fracture]
  num_classes: 12

data:
  root: /kaggle/input/rsna-2026-knee-abnormality-detection
  cache_dir: /kaggle/working/orion_cache
  image_size: 384
  num_slices: 24                # fixed sampling budget per study (Strategy A/C hybrid)
  num_workers: 2                # Kaggle/Colab CPU is the bottleneck, not GPU — keep low
  pin_memory: true
  persistent_workers: true
  metadata_csv: train.csv
  image_dir: train_images
  preprocessing:
    apply_voi_lut: true
    fix_photometric_interpretation: true
    normalization:
      method: percentile
      percentile_low: 0.5
      percentile_high: 99.5
      target_range: [0.0, 1.0]
    slice_selection:
      strategy: uniform
      num_slices: ${data.num_slices}
    output:
      image_size: [${data.image_size}, ${data.image_size}]
    cache:
      enabled: true
      backend: numpy
      dir: ${data.cache_dir}/preprocessed

model:
  backbone:
    name: swin_v2_base
    pretrained: true
    kwargs: {}
  text_encoder:
    name: xlm_roberta_base
    pretrained: true
    max_length: 256
  fusion:
    name: gated_fusion
  num_classes: 12
  vision_backbone:
    name: resnet50_scratch
    pretrained: false
    in_channels: 1
    drop_path_rate: 0.0
  neck:
    type: slice_attention
    hidden_dim: 256
    dropout: 0.0
  head:
    hidden_dims: [512]
    dropout: 0.3
    activation: gelu

training:
  epochs: 30
  batch_size: 4                 # per-step; combine with grad_accum for effective batch
  grad_accum_steps: 8           # effective batch size = 32
  amp: true                     # mandatory on T4/P100 — fp32 will not fit reasonable batches
  amp_dtype: fp16               # bf16 only on A100+; T4/P100 lack bf16 tensor cores
  grad_clip_norm: 1.0
  optimizer:
    name: adamw
    lr: 2.0e-4
    weight_decay: 0.01
  scheduler:
    name: cosine_warmup
    warmup_epochs: 2
  loss:
    name: asymmetric
    gamma_pos: 0
    gamma_neg: 4
  ema:
    enabled: true
    decay: 0.999
  checkpoint:
    metric: macro_auc_roc
    mode: max
    keep_last: 2
  max_epochs: ${training.epochs}
  gradient_accumulation_steps: ${training.grad_accum_steps}
  gradient_clip_val: ${training.grad_clip_norm}
  mixed_precision: ${training.amp}
  early_stopping_patience: 8

optimizer: ${training.optimizer}

scheduler:
  name: cosine_with_warmup
  warmup_epochs: ${training.scheduler.warmup_epochs}
  min_lr: 1.0e-7

cv:
  n_folds: 5
  strategy: group_kfold         # grouped by patient/institution — see data/splits/leakage.py

inference:
  tta: [identity, hflip]
  ensemble: mean

logging:
  backend: wandb
  wandb_project: rsna-knee-2026
  log_every_n_steps: 50
