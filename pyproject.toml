[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion"
version = "0.1.0"
description = "RSNA 2026 Knee Abnormality Detection — multimodal MRI + report classifier"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0.3",
    "transformers>=4.40",
    "pydicom>=2.4",
    "SimpleITK>=2.3",
    "torchio>=0.19",
    "albumentations>=1.4",
    "omegaconf>=2.3",
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "h5py>=3.10",
    "lmdb>=1.4",
    "wandb>=0.16",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]
efficiency = ["onnx>=1.16", "onnxruntime-gpu>=1.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]