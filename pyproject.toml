[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "orion"
version = "0.1.0"
description = "RSNA 2026 Knee Abnormality Detection — Research System"
authors = [{ name = "ORION Research Team" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["medical-imaging", "deep-learning", "mri", "knee", "rsna", "kaggle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # ─── Core PyTorch ─────────────────────────────────────────────────────────
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "torchaudio>=2.3.0",

    # ─── Medical Imaging ──────────────────────────────────────────────────────
    "pydicom>=2.4.0",           # DICOM parsing
    "pydicom[pil]",             # PIL backend for DICOM pixel data
    "SimpleITK>=2.3.0",         # Medical image I/O and resampling
    "monai>=1.3.0",             # Medical imaging transforms and utilities
    "torchio>=0.20.0",          # 3D MRI augmentations
    "nibabel>=5.2.0",           # NIfTI format support

    # ─── Computer Vision ──────────────────────────────────────────────────────
    "timm>=0.9.16",             # Pretrained vision models
    "albumentations>=1.4.0",    # 2D image augmentations
    "opencv-python>=4.9.0",     # Image processing

    # ─── NLP / Text ───────────────────────────────────────────────────────────
    "transformers>=4.40.0",     # HuggingFace transformers
    "tokenizers>=0.19.0",       # Fast tokenizers
    "sentencepiece>=0.2.0",     # SentencePiece tokenization
    "langdetect>=1.0.9",        # Language detection for multilingual reports
    "deep-translator>=1.11.4",  # Multi-engine translation

    # ─── Configuration ────────────────────────────────────────────────────────
    "omegaconf>=2.3.0",         # Hierarchical configuration
    "hydra-core>=1.3.2",        # Config management + CLI
    "pydantic>=2.6.0",          # Data validation and settings
    "python-dotenv>=1.0.0",     # .env file support

    # ─── Experiment Tracking ──────────────────────────────────────────────────
    "wandb>=0.17.0",            # Weights & Biases
    "tensorboard>=2.16.0",      # TensorBoard (fallback logging)

    # ─── Data Science ─────────────────────────────────────────────────────────
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",

    # ─── Visualization ────────────────────────────────────────────────────────
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "Pillow>=10.3.0",

    # ─── Storage / Caching ────────────────────────────────────────────────────
    "lmdb>=1.4.1",              # Fast key-value disk cache
    "h5py>=3.11.0",             # HDF5 for large arrays
    "tqdm>=4.66.0",             # Progress bars

    # ─── Utilities ────────────────────────────────────────────────────────────
    "rich>=13.7.0",             # Beautiful terminal output
    "loguru>=0.7.2",            # Structured logging
    "einops>=0.7.0",            # Tensor rearranging
    "kornia>=0.7.2",            # Differentiable image processing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",     # Parallel test execution
    "black>=24.3.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "notebook>=7.1.0",
]

weak-supervision = [
    "snorkel>=0.9.9",           # Programmatic weak supervision
    "cleanlab>=2.6.0",          # Confident learning / noisy labels
]

deployment = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "onnx>=1.16.0",
    "onnxruntime-gpu>=1.18.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
orion-train     = "scripts.train:main"
orion-evaluate  = "scripts.evaluate:main"
orion-predict   = "scripts.predict:main"
orion-preprocess = "scripts.preprocess:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

# ─── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = '\.pyi?$'

# ─── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "C4", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"notebooks/**" = ["ANN", "E501"]
"scripts/**" = ["ANN"]

# ─── MyPy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/orion"]

# ─── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -p no:warnings"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a GPU",
    "integration: marks integration tests",
]

# ─── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/orion"]
omit = ["tests/*", "notebooks/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
